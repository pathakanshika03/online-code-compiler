<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Online Code Compiler</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container">
        <h1>Online Code Compiler</h1>

        <div class="card p-3">

            <!-- LANGUAGE DROPDOWN -->
            <label>Language</label>
            <select id="language" class="dropdown border mt-2">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="javascript">JavaScript</option>
                <option value="c">C</option>
                <option value="cpp">C++</option>
            </select>

            <!-- MAIN FLEX AREA -->
            <div class="d-flex mt-3" style="height: 400px;">

                <!-- LEFT SIDE: EDITOR -->
                <div class="w-75 pe-2">
                    <label>Write Code</label>
                    <textarea id="code" placeholder="Write your code here..."></textarea>
                </div>

                <!-- RIGHT SIDE: FILE TABS -->
                <div class="w-25 ps-2">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="fw-bold">Files</label>
                        <button class="btn btn-sm btn-dark" onclick="createNewTabInput()">+</button>
                    </div>

                    <ul id="fileTabs" class="list-group" style="cursor: pointer;"></ul>
                </div>

            </div>

            <!-- OUTPUT -->
            <label class="mt-3">Output</label>
            <pre id="output"></pre>

            <!-- RUN BUTTON -->
            <button class="run-btn mt-2" onclick="runCode()">▶ Run Code</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
