<!DOCTYPE html>
<html>

<head>
    <title>Code Editor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ---------------- NAVBAR ---------------- -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3">
        <a class="navbar-brand" href="index.html">Online Code Editor</a>

        <ul class="navbar-nav ms-auto">

            <!-- Theme Switcher -->
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    🎨 Theme
                </a>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" onclick="applyTheme('neon')">Neon Pink</a></li>
                    <li><a class="dropdown-item" onclick="applyTheme('vscode')">VS Code Dark</a></li>
                    <li><a class="dropdown-item" onclick="applyTheme('midnight')">Midnight Blue</a></li>
                    <li><a class="dropdown-item" onclick="applyTheme('light')">Light Mode</a></li>
                </ul>
            </li>

            <!-- Logout button -->
            <li class="nav-item ms-3" id="authButton"></li>

        </ul>
    </nav>

    <!-- ---------------- MAIN LAYOUT ---------------- -->
    <div class="container-fluid mt-4 d-flex gap-4">

        <!-- ---------------- FILE SIDEBAR ---------------- -->
        <div class="p-3 rounded file-panel" style="width: 18rem;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">📁 Your Files</h5>
                <button class="btn btn-sm btn-outline-light" onclick="createFileInput()">+ New</button>
            </div>

            <ul id="fileTabs" class="list-group mb-3"></ul>
        </div>

        <!-- ---------------- EDITOR PANEL ---------------- -->
        <div class="flex-grow-1 d-flex flex-column">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <select id="language" class="form-select mb-0" style="width: 200px;">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                </select>

                <div>
                    <button class="btn btn-secondary me-2" id="saveBtn" onclick="saveCurrentFile()">💾 Save</button>
                    <button class="btn btn-primary run-btn" onclick="runCode()">▶ Run</button>
                </div>
            </div>

            <!-- Code Editor -->
            <textarea id="code" class="form-control code-box mb-3" placeholder="Write code here..."></textarea>

            <!-- Output Box -->
            <pre id="output" class="output-box"></pre>

        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script> <!-- must provide api() and theme helpers -->
    <script src="editor.js"></script>

</body>

</html>
